<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Japanese Auction Grade Guide</title>
  <desc id="desc">A ClickCar themed illustration of an auction grading sheet with vehicle condition grades and inspection marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#31090d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3045"/>
      <stop offset="1" stop-color="#b00013"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1028" cy="110" r="210" fill="#ef233c" opacity="0.08"/>
  <circle cx="130" cy="620" r="260" fill="#ffffff" opacity="0.05"/>

  <g transform="translate(96 76)" filter="url(#shadow)">
    <rect width="1008" height="524" rx="30" fill="#f8fafc"/>
    <rect width="1008" height="92" rx="30" fill="#111827"/>
    <path d="M0 62h1008v42H0z" fill="#111827"/>

    <g transform="translate(42 28)">
      <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#red)"/>
      <path d="M13 28c22-24 40-9 50-5" transform="scale(.58)" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <text x="60" y="29" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">ClickCar Auction Grade Guide</text>
    </g>

    <g transform="translate(680 24)">
      <rect x="0" y="0" width="240" height="44" rx="22" fill="#ffffff" opacity="0.1"/>
      <text x="22" y="29" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">USS / TAA / HAA</text>
      <circle cx="204" cy="22" r="6" fill="#ff3045"/>
      <circle cx="222" cy="22" r="6" fill="#22c55e"/>
    </g>

    <g transform="translate(48 132)">
      <text x="0" y="0" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Auction Sheet Reading</text>
      <text x="0" y="34" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="17">Overall grade, exterior, interior, and inspection symbols</text>

      <g transform="translate(0 76)">
        <rect width="430" height="282" rx="20" fill="#ffffff" stroke="#e5e7eb"/>
        <g transform="translate(28 30)">
          <text x="0" y="0" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">OVERALL GRADE</text>
          <g transform="translate(0 28)">
            <rect width="86" height="70" rx="16" fill="#fee2e2"/>
            <text x="43" y="45" text-anchor="middle" fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">4.5</text>
          </g>
          <g transform="translate(104 28)">
            <rect width="86" height="70" rx="16" fill="#f0fdf4"/>
            <text x="43" y="45" text-anchor="middle" fill="#16a34a" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">A</text>
          </g>
          <g transform="translate(208 28)">
            <rect width="86" height="70" rx="16" fill="#eff6ff"/>
            <text x="43" y="45" text-anchor="middle" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">B</text>
          </g>

          <g transform="translate(0 132)" fill="none" stroke="#d1d5db" stroke-width="3" stroke-linecap="round">
            <path d="M15 62c27-42 82-66 149-54 48 9 81 37 111 58 20 14 50 15 74 20"/>
            <path d="M46 86h270"/>
            <circle cx="90" cy="96" r="21"/>
            <circle cx="281" cy="96" r="21"/>
          </g>
          <g transform="translate(0 248)">
            <rect width="342" height="7" rx="4" fill="#e5e7eb"/>
            <rect width="238" height="7" rx="4" fill="url(#red)"/>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(540 154)">
      <rect width="410" height="390" rx="24" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="30" y="44" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Inspection Marks</text>
      <text x="30" y="74" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="14">Read symbols before bidding</text>

      <g transform="translate(30 112)" font-family="Arial, Helvetica, sans-serif">
        <g>
          <rect width="350" height="42" rx="12" fill="#f9fafb"/>
          <text x="18" y="27" fill="#dc2626" font-size="16" font-weight="800">A2</text>
          <text x="70" y="27" fill="#374151" font-size="15">Scratch level 2</text>
        </g>
        <g transform="translate(0 54)">
          <rect width="350" height="42" rx="12" fill="#f9fafb"/>
          <text x="18" y="27" fill="#dc2626" font-size="16" font-weight="800">U3</text>
          <text x="70" y="27" fill="#374151" font-size="15">Dent level 3</text>
        </g>
        <g transform="translate(0 108)">
          <rect width="350" height="42" rx="12" fill="#f9fafb"/>
          <text x="18" y="27" fill="#dc2626" font-size="16" font-weight="800">XX</text>
          <text x="70" y="27" fill="#374151" font-size="15">Replaced panel</text>
        </g>
        <g transform="translate(0 162)">
          <rect width="350" height="42" rx="12" fill="#f9fafb"/>
          <text x="18" y="27" fill="#dc2626" font-size="16" font-weight="800">R</text>
          <text x="70" y="27" fill="#374151" font-size="15">Repair history</text>
        </g>
      </g>

      <g transform="translate(30 342)">
        <rect width="350" height="8" rx="4" fill="#e5e7eb"/>
        <rect width="284" height="8" rx="4" fill="#111827"/>
      </g>
    </g>
  </g>
</svg>
