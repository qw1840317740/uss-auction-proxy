<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Three diamonds in pinwheel arrangement -->
  <polygon points="100,25 120,75 100,100 80,75" fill="#cc0000"/>
  <polygon points="100,100 120,75 175,95 155,120" fill="#cc0000"/>
  <polygon points="100,100 80,75 25,95 45,120" fill="#cc0000"/>
  <polygon points="100,100 120,125 100,175 80,125" fill="#cc0000"/>
  <!-- Center negative space -->
  <polygon points="100,85 115,100 100,115 85,100" fill="white"/>
</svg>
